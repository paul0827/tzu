<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 去背圖片管理系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f0f0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .login-section { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; }
        .section { margin-top: 20px; padding: 20px; border: 1px solid #ddd; display: none; }
        .section.active { display: block; }
        input, select { padding: 8px; margin: 5px; width: 200px; }
        button { padding: 10px 20px; background: #0066cc; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0052a3; }
        .user-list { margin-top: 15px; }
        .user-item { padding: 10px; background: #f9f9f9; margin: 5px 0; border-radius: 4px; }
        canvas { border: 1px solid #ddd; margin: 10px 0; max-width: 100%; background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; } 
        .preview { width: 300px; height: 300px; border: 1px solid #ddd; margin: 10px 0; object-fit: contain; background: #eee; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .gallery img { width: 100%; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
        .loading { display: none; color: #0066cc; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 去背與背景替換系統</h1>

        <div class="login-section">
            <h2>登入</h2>
            <input type="text" id="username" placeholder="帳號" value="admin">
            <input type="password" id="password" placeholder="密碼" value="0">
            <button onclick="login()">登入</button>
            <div id="loginMsg"></div>
        </div>

        <div id="adminSection" class="section">
            <h2>管理員面板</h2>
            <h3>新增使用者</h3>
            <input type="text" id="newUsername" placeholder="新使用者帳號">
            <input type="password" id="newPassword" placeholder="密碼">
            <button onclick="addUser()">新增使用者</button>
            <div id="adminMsg"></div>

            <h3>使用者列表</h3>
            <div class="user-list" id="userList"></div>
        </div>

        <div id="userSection" class="section">
            <h2>圖片上傳與 AI 編輯</h2>

            <div>
                <h3>1. 上傳圖片或拍照 (人物照效果最佳)</h3>
                <input type="file" id="imageUpload" accept="image/*">
                <button onclick="triggerCamera()">📷 使用相機拍照</button>
                <canvas id="camera" style="display:none;"></canvas>
                <video id="video" style="display:none;"></video>
            </div>

            <div>
                <h3>原始圖片</h3>
                <img id="preview" class="preview" style="display:none;">
                <div id="uploadMsg"></div>
            </div>

            <div>
                <h3>2. 選擇新背景</h3>
                <select id="bgOption">
                    <option value="color">純色背景</option>
                    <option value="upload">上傳背景圖片</option>
                    <option value="transparent">透明背景</option>
                </select>
                <input type="color" id="bgColor" value="#ffffff" style="display:inline-block; width: 100px;">
                <input type="file" id="bgUpload" accept="image/*" style="display:none;">
            </div>

            <div>
                <h3>3. AI 處理結果</h3>
                <div style="margin-bottom: 10px;">
                    <button onclick="processImage()">✨ AI 去背並合成背景</button>
                    <span id="loadingText" class="loading">⏳ AI 正在處理中，請稍候...</span>
                </div>
                
                <canvas id="canvas" width="400" height="400"></canvas>
                <br>
                <button onclick="downloadImage()">⬇️ 下載圖片</button>
                <button onclick="generateQR()">📱 生成QR Code</button>
            </div>

            <div id="qrSection" style="display:none; margin-top: 15px;">
                <h3>QR Code</h3>
                <div id="qrcode"></div>
                <br>
                <small>請使用手機掃描上方 QR Code</small>
            </div>

            <div>
                <h3>我的圖片庫</h3>
                <div class="gallery" id="gallery"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let users = { admin: '0' };
        let currentImageData = null;
        let currentBgImage = null;
        
        // AI 模型相關變數
        let selfieSegmentation = null;
        let originalImgElement = null; // 用來暫存要送給 AI 的原始圖片物件

        // --- 初始化 AI 模型 ---
        function initSelfieSegmentation() {
            selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
            }});
            selfieSegmentation.setOptions({
                modelSelection: 1, // 0: 一般, 1: 風景/高品質
            });
            selfieSegmentation.onResults(onResults);
        }

        // --- AI 處理完成後的回調函數 (合成邏輯) ---
        function onResults(results) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            // 1. 準備一個暫存 Canvas 來畫「去背後的人物」
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');

            // 計算圖片縮放以適應 400x400 (保持比例)
            const img = results.image;
            const scale = Math.min(width / img.width, height / img.height);
            const x = (width - img.width * scale) / 2;
            const y = (height - img.height * scale) / 2;
            const w = img.width * scale;
            const h = img.height * scale;

            // --- 繪製遮罩 ---
            tempCtx.drawImage(results.segmentationMask, x, y, w, h);
            
            // --- 應用遮罩模式：保留重疊部分 (source-in) ---
            // 遮罩中白色部分(人物)會被保留，黑色部分(背景)會變透明
            tempCtx.globalCompositeOperation = 'source-in';
            tempCtx.drawImage(img, x, y, w, h);

            // 2. 在主 Canvas 繪製「新背景」
            const bgOption = document.getElementById('bgOption').value;
            
            if (bgOption === 'color') {
                ctx.fillStyle = document.getElementById('bgColor').value;
                ctx.fillRect(0, 0, width, height);
            } else if (bgOption === 'upload' && currentBgImage) {
                // 繪製上傳的背景圖 (拉伸填滿)
                ctx.drawImage(currentBgImage, 0, 0, width, height);
            } 
            // 如果是 transparent，什麼都不畫，直接保持透明

            // 3. 將「去背後的人物」畫在「新背景」之上
            ctx.drawImage(tempCanvas, 0, 0);

            // 關閉 Loading
            document.getElementById('loadingText').style.display = 'none';
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('loginMsg');

            if (users[username] === password) {
                currentUser = username;
                msg.innerHTML = `<p class="success">登入成功！歡迎 ${username}</p>`;
                document.getElementById('adminSection').style.display = username === 'admin' ? 'block' : 'none';
                document.getElementById('userSection').classList.add('active');
                
                // 登入成功後初始化 AI 模型
                if (!selfieSegmentation) {
                    initSelfieSegmentation();
                }
                loadGallery();
            } else {
                msg.innerHTML = '<p class="error">帳號或密碼錯誤</p>';
            }
        }

        function addUser() {
            if (currentUser !== 'admin') {
                document.getElementById('adminMsg').innerHTML = '<p class="error">只有管理員可以新增使用者</p>';
                return;
            }
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;

            if (!username || !password) {
                document.getElementById('adminMsg').innerHTML = '<p class="error">請填入帳號和密碼</p>';
                return;
            }

            users[username] = password;
            document.getElementById('adminMsg').innerHTML = `<p class="success">使用者 ${username} 新增成功</p>`;
            document.getElementById('newUsername').value = '';
            document.getElementById('newPassword').value = '';
            displayUsers();
        }

        function displayUsers() {
            const userList = document.getElementById('userList');
            userList.innerHTML = Object.keys(users).map(u => `<div class="user-item">${u}</div>`).join('');
        }

        function triggerCamera() {
            const video = document.getElementById('video');
            video.style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        // 3秒後自動拍照
                        setTimeout(capturePhoto, 3000);
                    };
                })
                .catch(err => {
                    alert("無法啟動相機: " + err);
                });
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('camera');
            // 設定畫布大小與影片一致
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // 停止相機串流
            const stream = video.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());

            currentImageData = canvas.toDataURL();
            document.getElementById('preview').src = currentImageData;
            document.getElementById('preview').style.display = 'block';
            video.style.display = 'none';
        }

        document.getElementById('imageUpload')?.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageData = event.target.result;
                    document.getElementById('preview').src = currentImageData;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.getElementById('bgOption')?.addEventListener('change', (e) => {
            document.getElementById('bgColor').style.display = e.target.value === 'color' ? 'inline-block' : 'none';
            document.getElementById('bgUpload').style.display = e.target.value === 'upload' ? 'block' : 'none';
        });

        document.getElementById('bgUpload')?.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => { currentBgImage = img; };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // --- 核心處理函數 ---
        async function processImage() {
            if (!currentImageData) {
                document.getElementById('uploadMsg').innerHTML = '<p class="error">請先上傳圖片</p>';
                return;
            }

            if (!selfieSegmentation) {
                alert("AI 模型尚未初始化完成，請稍後再試。");
                return;
            }

            // 顯示 Loading
            document.getElementById('loadingText').style.display = 'inline';

            // 建立一個 Image 物件讓 AI 讀取
            const img = new Image();
            img.src = currentImageData;
            
            img.onload = async () => {
                // 將圖片送入 MediaPipe 進行處理
                await selfieSegmentation.send({image: img});
            };
        }

        function downloadImage() {
            const canvas = document.getElementById('canvas');
            // 檢查 Canvas 是否有內容 (簡單判斷)
            if (canvas.width === 0) {
                alert("請先進行編輯");
                return;
            }

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `photo_${Date.now()}.png`;
            link.click();
            saveToGallery(link.href);
        }

// --- 使用 ImgBB API 的 QR Code 生成函式 ---
        async function generateQR() {
            // ▼▼▼ 請將此處替換為你的 ImgBB API Key ▼▼▼
            const IMGBB_API_KEY = '0bfcde42099ba344d07a1fe282d5be81'; 
            // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

            const canvas = document.getElementById('canvas');
            const qrDiv = document.getElementById('qrcode');
            const qrSection = document.getElementById('qrSection');

            // 1. 檢查是否有圖片
            if (isCanvasBlank(canvas)) {
                alert("請先進行 AI 處理或合成圖片");
                return;
            }

            // 檢查是否填寫 API Key
            if (IMGBB_API_KEY === '請在此填入你的IMGBB_API_KEY' || IMGBB_API_KEY === '') {
                alert("請先在程式碼中填入 ImgBB 的 API Key 才能使用上傳功能！");
                return;
            }

            // 2. 顯示介面與載入中
            qrSection.style.display = 'block';
            qrDiv.innerHTML = ''; 
            
            const msg = document.createElement('p');
            msg.innerText = "☁️ 正在上傳至 ImgBB 並生成 QR Code，請稍候...";
            msg.style.color = "#0066cc";
            qrDiv.appendChild(msg);

            try {
                // 3. 取得 Base64 圖片數據 (移除開頭的 data:image/png;base64,)
                const base64Image = canvas.toDataURL('image/png').split(',')[1];

                // 4. 準備上傳資料 (ImgBB 使用 FormData)
                const formData = new FormData();
                formData.append("image", base64Image);

                // 5. 發送請求 (Key 帶在 URL 參數中)
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                // 6. 處理結果
                qrDiv.innerHTML = ''; // 清除載入文字

                if (result.success) {
                    const imageUrl = result.data.url; // ImgBB 的圖片直連網址
                    
                    // 生成 QR Code
                    new QRCode(qrDiv, {
                        text: imageUrl,
                        width: 200,
                        height: 200,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    // 顯示文字連結
                    const linkText = document.createElement('div');
                    linkText.innerHTML = `<br><a href="${imageUrl}" target="_blank" style="color:#0066cc; text-decoration:underline;">點擊開啟圖片連結</a>`;
                    qrDiv.appendChild(linkText);
                    
                } else {
                    // 如果 API 回傳錯誤
                    throw new Error(result.error ? result.error.message : "上傳失敗");
                }

            } catch (error) {
                console.error('ImgBB Error:', error);
                qrDiv.innerHTML = `<p class="error">生成失敗：${error.message}<br>請檢查 API Key 是否正確。</p>`;
            }
        }

        // 輔助函式：檢查 Canvas 是否為空白 (若原本已有此函式可忽略)
        function isCanvasBlank(canvas) {
            const context = canvas.getContext('2d');
            const pixelBuffer = new Uint32Array(
                context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
            );
            return !pixelBuffer.some(color => color !== 0);
        }
        

        function saveToGallery(imageData) {
            let gallery = JSON.parse(localStorage.getItem(`gallery_${currentUser}`) || '[]');
            gallery.push(imageData);
            localStorage.setItem(`gallery_${currentUser}`, JSON.stringify(gallery));
            loadGallery();
        }

        function loadGallery() {
            const gallery = JSON.parse(localStorage.getItem(`gallery_${currentUser}`) || '[]');
            document.getElementById('gallery').innerHTML = gallery.map(img => 
                `<img src="${img}" onclick="useImage('${img}')" title="點擊使用此圖片">`
            ).join('');
        }

        function useImage(imageData) {
            currentImageData = imageData;
            document.getElementById('preview').src = imageData;
            document.getElementById('preview').style.display = 'block';
            // 滾動到上方
            document.getElementById('userSection').scrollIntoView({behavior: 'smooth'});
        }
    </script>
</body>
</html>
